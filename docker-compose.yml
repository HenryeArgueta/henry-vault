services:
  henry-vault:
    build: .
    container_name: henry-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - henry-vault-data:/data
    command: ["hv", "--db", "/data/vault.db", "web", "--host", "0.0.0.0", "--port", "8787"]

volumes:
  henry-vault-data:
